<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Góndola de Marketing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar"><div class="bar-in">
  <a class="logo" href="#"><i></i>Góndola de Marketing</a>
  <div class="lvl" id="lvl"></div>
  <button type="button" class="btn ghost sm" id="reset-all">Reiniciar progreso</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-t" hidden>
  <div class="modal-box">
    <h2 id="modal-t">¿Reiniciar todo tu progreso?</h2>
    <p>Se borran tu XP, nivel, racha, récord relámpago, tarjetas sabidas y mejores puntajes. No se puede deshacer.</p>
    <div class="btns"><button type="button" class="btn ghost" id="modal-no">Cancelar</button><button type="button" class="btn nob" id="modal-yes">Sí, reiniciar</button></div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
